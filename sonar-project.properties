# Analyse SonarQube / SonarCloud du code de test (qualité, bugs, vulnérabilités, secrets).
# En CI, le scan s'exécute quand le secret SONAR_TOKEN est configuré.
sonar.projectKey=wassimaskri-99_booking-quality-suite
sonar.organization=wassimaskri-99
sonar.projectName=Booking Quality Suite

sonar.sources=pages,steps,fixtures,api,config,test-data,scripts,load
sonar.tests=tests,features
sonar.exclusions=**/node_modules/**,.features-gen/**,reports/**
sonar.sourceEncoding=UTF-8

# Le rapport ESLint est importé comme problèmes externes.
sonar.eslint.reportPaths=reports/eslint/eslint.json
sonar.qualitygate.wait=true
